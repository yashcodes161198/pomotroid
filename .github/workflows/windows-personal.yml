name: Personal Windows installer

on:
  push:
    branches: ['codex/distraction-counter']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run test:duration
      - run: npm run check
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: pomotroid-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/pomotroid.exe
          if-no-files-found: error
